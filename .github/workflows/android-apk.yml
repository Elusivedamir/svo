name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Download Godot 4.5.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.2-stable"
          ROOT="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fL --retry 3 "${ROOT}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fL --retry 3 "${ROOT}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2

      - name: Generate temporary debug signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Import Godot project and export APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          mkdir -p build
          python3 - <<'PYMAP'
          import struct
          from pathlib import Path
          expect={"assets/map/terrain_v0.3.3.png":(3344,1882),"assets/map/navigation_v0.3.3.png":(418,236)}
          for file,size in expect.items():
              b=Path(file).read_bytes()[:24]
              assert b[:8]==b"\x89PNG\r\n\x1a\n",file
              dims=struct.unpack(">II",b[16:24])
              assert dims==size,(file,dims,size)
              print("PASS PNG",file,dims)
          PYMAP
          "$GODOT" --headless --path . --editor --quit
          # Run the real launch scene, not just the exporter: black-screen regressions must fail CI.
          set +e
          timeout 14s "$GODOT" --headless --audio-driver Dummy --path . > "$RUNNER_TEMP/smoke.log" 2>&1
          smoke_exit=$?
          set -e
          cat "$RUNNER_TEMP/smoke.log"
          if [[ "$smoke_exit" != 0 && "$smoke_exit" != 124 ]]; then
            echo "ERROR: Godot process failed during startup: $smoke_exit"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR:|Parse Error:|Invalid call\.|Failed to load script' "$RUNNER_TEMP/smoke.log"; then
            echo "ERROR: Godot runtime/script error detected"
            exit 1
          fi
          if ! grep -Fq 'SMOKE_MAIN_MENU_READY' "$RUNNER_TEMP/smoke.log"; then
            echo "ERROR: Main menu did not become ready during startup test"
            exit 1
          fi
          if ! grep -Fq 'SMOKE_MUSIC_STARTED: true' "$RUNNER_TEMP/smoke.log"; then
            echo "ERROR: music autoload did not start"
            exit 1
          fi
          echo "PASS: music autoload started"
          echo "PASS: real startup reached main menu"
          if ! grep -Fq 'SMOKE_NEW_GAME_BUTTON_ACTIVE' "$RUNNER_TEMP/smoke.log"; then
            echo "ERROR: New Game button was not enabled"
            exit 1
          fi
          # Also launch the actual terrain scene, not only the menu.
          set +e
          timeout 20s "$GODOT" --headless --audio-driver Dummy --path . res://scenes/world_map.tscn > "$RUNNER_TEMP/map_smoke.log" 2>&1
          map_exit=$?
          set -e
          cat "$RUNNER_TEMP/map_smoke.log"
          if [[ "$map_exit" != 0 && "$map_exit" != 124 ]]; then
            echo "ERROR: Map failed during startup ($map_exit)"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR:|Parse Error:|Invalid call\.|Failed to load script' "$RUNNER_TEMP/map_smoke.log"; then
            echo "ERROR: Map script error detected"
            exit 1
          fi
          if ! grep -Fq 'SMOKE_MAP_READY' "$RUNNER_TEMP/map_smoke.log"; then
            echo "ERROR: Map scene did not initialize"
            exit 1
          fi
          for marker in SMOKE_NAV_READY SMOKE_NAV_OBSTACLES_BLOCKED SMOKE_NAV_ROUTE_FOUND SMOKE_NAV_FOUR_SECTORS SMOKE_NAV_CROSS_SECTOR_ROUTES SMOKE_NAV_BRIDGE_OPEN SMOKE_NAV_UNIQUE_WORLD; do
            if ! grep -Fq "$marker" "$RUNNER_TEMP/map_smoke.log"; then
              echo "ERROR: navigation check missing: $marker"
              exit 1
            fi
          done
          echo "PASS: real map navigation and obstacles verified"
          echo "PASS: map scene started and terrain loaded"
          "$GODOT" --headless --path . --export-debug "Android" build/SVO-v0.3.3-debug.apk
          test -s build/SVO-v0.3.3-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SVO-v0.3.3-debug
          path: build/SVO-v0.3.3-debug.apk
          if-no-files-found: error
